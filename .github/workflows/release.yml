# Automatic Android release (decided 2026-11-18): every merge to main that changes the app is tested,
# built, signed, verified and published as the next patch version. Setup: docs/delivery/GITHUB-RELEASE.md.
name: Android release

on:
  push:
    branches: [main]
    # Documentation-only merges do not ship a new APK version.
    paths-ignore:
      - 'docs/**'
      - 'specs/**'
      - 'prototypes/**'
      - '.vibe-wise/**'
      - 'tools/developer-dashboard/**'
      - '**/*.md'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version for a minor/major bump, for example 1.2.0 (no v prefix). Leave empty for the next patch.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# One release at a time, in merge order, so two merges never pick the same version.
concurrency:
  group: android-release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  build:
    name: Test, sign and verify Android APK
    # Releases come only from main, also when started by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.release.outputs.version }}
      apk: ${{ steps.release.outputs.apk }}
      artifact: ${{ steps.artifact.outputs.name }}
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          # Tags and history are needed to choose the version and list changes since the last release.
          fetch-depth: 0
          fetch-tags: true

      - name: Release helper tests
        run: python3 -m unittest discover -s tools/release/tests -v

      - name: Choose version
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
          REQUESTED_VERSION: ${{ inputs.version }}
        run: python3 tools/release/release.py version

      - name: Check for conflicting release or tag
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
        run: python3 tools/release/release.py check

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - uses: actions/setup-java@v5
        with:
          distribution: microsoft
          java-version: '21'

      - name: Core tests
        run: dotnet test tests/DueDateChecker.Core.Tests/DueDateChecker.Core.Tests.csproj -c Release

      - name: App tests
        run: dotnet test tests/DueDateChecker.App.Tests/DueDateChecker.App.Tests.csproj -c Release

      - name: Install MAUI Android workload and SDK packages
        run: |
          dotnet workload install maui-android
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Restore temporary signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: python3 tools/release/release.py decode

      - name: Publish signed Release APK
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          VERSION_CODE: ${{ steps.release.outputs.code }}
        run: |
          dotnet publish src/DueDateChecker.App/DueDateChecker.App.csproj \
            -c Release -f net10.0-android \
            -p:AndroidPackageFormats=apk \
            -p:AndroidSdkBuildToolsVersion=36.0.0 \
            "-p:AndroidSdkDirectory=$ANDROID_HOME" \
            "-p:JavaSdkDirectory=$JAVA_HOME" \
            -p:AndroidKeyStore=true \
            "-p:AndroidSigningKeyStore=$RUNNER_TEMP/duewise-upload.jks" \
            "-p:AndroidSigningKeyAlias=$ANDROID_KEY_ALIAS" \
            -p:AndroidSigningStorePass=env:ANDROID_KEYSTORE_PASSWORD \
            -p:AndroidSigningKeyPass=env:ANDROID_KEY_PASSWORD \
            "-p:ApplicationDisplayVersion=$RELEASE_VERSION" \
            "-p:ApplicationVersion=$VERSION_CODE" \
            -o artifacts/release-build

      - name: Verify signature, identity, versions and checksum; write release notes
        env:
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          RELEASE_VERSION: ${{ steps.release.outputs.version }}
          PREVIOUS_TAG: ${{ steps.release.outputs.previous }}
        run: python3 tools/release/release.py package

      - name: Remove temporary signing material
        if: always()
        run: python3 tools/release/release.py clean

      - name: Name verified artifact
        id: artifact
        run: echo "name=duewise-release-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"

      - name: Upload verified public deliverables
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            artifacts/github-release/${{ steps.release.outputs.apk }}
            artifacts/github-release/${{ steps.release.outputs.apk }}.sha256
            artifacts/github-release/RELEASE-NOTES.md
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  release:
    name: Publish GitHub release
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_VERSION: ${{ needs.build.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: ${{ needs.build.outputs.artifact }}
          path: artifacts/github-release

      - name: Publish release with APK and checksum
        run: python3 tools/release/release.py publish
